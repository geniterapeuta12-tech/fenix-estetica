<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0c">
<title>Fênix Clients</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#d4af37}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1100px 550px at 50% -10%,rgba(212,175,55,.12),transparent 60%),#0d0d0c;font-family:'Montserrat',system-ui,-apple-system,sans-serif;color:#f5f5f5;min-height:100vh}
/* ===== cabeçalho (fiel ao app da gestão) ===== */
.fc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 10px;max-width:980px;margin:0 auto}
.brand{font-family:'Playfair Display',Georgia,serif;letter-spacing:.14em;font-size:1.15rem;white-space:nowrap}
.brand span{color:var(--acc,#d4af37)}
.quem{display:flex;align-items:center;gap:10px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.35);border-radius:13px;padding:8px 12px;min-width:0}
.quem .av{width:36px;height:36px;min-width:36px;border-radius:50%;background:linear-gradient(135deg,var(--acc,#d4af37),#7a5f14);color:#141414;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem}
.quem b{font-size:.9rem;color:#fff;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.quem small{color:#9a927e;font-size:.66rem}
.clinbar{max-width:980px;margin:0 auto;padding:0 20px 10px;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#9a927e}
/* ===== abas ===== */
.tabs{position:sticky;top:0;z-index:30;display:flex;gap:2px;background:rgba(13,13,12,.97);border-bottom:1px solid rgba(212,175,55,.32);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .in{display:flex;gap:2px;margin:0 auto}
.tab{appearance:none;border:0;background:none;display:flex;align-items:center;gap:8px;padding:13px 15px;color:#cfc8b8;font:600 .84rem 'Montserrat',sans-serif;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab .ic{width:18px;height:18px;min-width:18px}
.tab:hover{background:rgba(255,255,255,.05)}
.tab.on{color:#f1d27a;border-bottom-color:var(--acc,#d4af37);background:rgba(212,175,55,.08)}
/* ===== conteúdo ===== */
.wrap{max-width:980px;margin:0 auto;padding:16px 20px 60px}
.panelcard{background:linear-gradient(180deg,#141414,#0e0e0e);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px 18px;margin:0 0 14px}
.pc-tt{font-family:'Playfair Display',Georgia,serif;font-size:1.18rem;display:flex;align-items:center;gap:9px}
.pc-tt .dot{width:8px;height:8px;border-radius:50%;background:var(--acc,#d4af37);box-shadow:0 0 10px rgba(212,175,55,.8)}
hr.frule{border:0;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.55),transparent);margin:12px 0 14px}
.hero{text-align:center;padding:26px 18px}
.hero .grande{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;margin-top:12px}
.hero .grande span{color:var(--acc,#d4af37)}
.prox{margin:16px auto 0;max-width:430px;background:rgba(212,175,55,.09);border:1px solid rgba(212,175,55,.4);border-radius:14px;padding:14px}
.prox small{display:block;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc,#d4af37);font-weight:700}
.prox b{font-size:1.05rem}
.prox span{display:block;color:#9a927e;font-size:.8rem;margin-top:3px}
table{width:100%;border-collapse:collapse}
th{font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9a927e;text-align:left;padding:7px 6px;border-bottom:1px solid rgba(212,175,55,.35)}
td{padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.07);font-size:.9rem;vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:#5ec98c}.aberto{color:#e7c96a}
.fsub{font-size:.8rem;color:#9a927e;margin-top:2px}
.fempty{color:#9a927e;font-size:.9rem;margin:6px 0}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;min-width:110px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc,#d4af37),#f1d27a)}
.pct{font-size:.72rem;color:#9a927e}
.estado{text-align:center;padding:60px 20px;color:#9a927e}
.estado b{color:#e8e2d4}
.rodape{color:#6d6553;font-size:.72rem;text-align:center;padding:0 0 40px}
.fcpanel{display:none}.fcpanel.on{display:block}
@media (max-width:640px){
.fc-head{flex-wrap:wrap;padding:14px 12px 8px}
.fcmsg{max-width:980px;margin:0 auto;padding:9px 13px;border:1px solid var(--acc,#d4af37);border-radius:12px;background:rgba(212,175,55,.08);color:#f3ecd8;font:600 .92rem Montserrat}
.quem b{max-width:120px}
.wrap{padding:14px 12px 50px}
.tab{padding:12px 11px;font-size:.8rem}
td,th{padding:8px 4px}}
details.doc{border:1px solid rgba(212,175,55,.22);border-radius:12px;margin:8px 0;background:rgba(212,175,55,.04)}
details.doc summary{cursor:pointer;padding:11px 13px;font-weight:600;color:#f5efe0;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.doc summary::-webkit-details-marker{display:none}
details.doc summary small{color:#9a917d;font-weight:400;white-space:nowrap}
details.doc .dtexto{padding:0 13px 12px;color:#e9e2cf;font-size:.86rem;line-height:1.55;overflow-wrap:anywhere}
details.doc .dtexto img{max-width:100%;border-radius:8px}
details.doc[open] summary{border-bottom:1px solid rgba(212,175,55,.15)}
.fdempty{color:#9a917d;font-size:.85rem;padding:10px 2px}
@media print{body{background:#fff;color:#141414}.tabs,.fc-head,.clinbar,.rodape{display:none!important}.fcpanel{display:block!important;page-break-before:always}.fcpanel:first-of-type{page-break-before:auto}.panelcard{background:#fff;border-color:#ddd}.pos{color:#1d6b40}.aberto{color:#8a6d12}}

/* R54 — números e textos NUNCA mais estouram o quadro no celular */
.wrap{overflow-x:hidden}
.panelcard{overflow-x:auto;-webkit-overflow-scrolling:touch}
td{max-width:0;overflow-wrap:anywhere;word-break:break-word}
.num{font-size:.84rem}
.bar{min-width:60px;width:100%;max-width:110px}
/* R54 — rolagem elegante (fim da barra cinza) */
*{scrollbar-width:thin;scrollbar-color:rgba(212,175,55,.3) transparent}
*::-webkit-scrollbar{width:7px;height:7px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3);border-radius:99px}
@media(hover:none){*{scrollbar-width:none}*::-webkit-scrollbar{width:0;height:0}}
/* ia chat */
#fcIaMsgs .iamsg{max-width:86%;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:.92rem;line-height:1.55;word-wrap:break-word}
#fcIaMsgs .iamsg.user{margin-left:auto;background:var(--acc,#d4af37);color:#141414}
#fcIaMsgs .iamsg.ia{background:#26221a;color:#efe8d6;border:1px solid #3a3428}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 8l9 5 9-5M12 13v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v6h6M9 13h6M9 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol><symbol id="i-fin" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12.5" r="2.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 9.5h.01M18 15.5h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>
<header class="fc-head">
  <div class="brand">✦ FÊNIX <span>ESTÉTICA</span></div>
  <div class="quem" id="fcQuem" style="display:none"><span class="av" id="fcAv">?</span><div style="min-width:0"><b id="fcNome">…</b><small>seu espaço</small></div></div>
</header>
<div class="clinbar" id="fcClin">carregando…</div>
<nav class="tabs" id="fcTabs" style="display:none"><div class="in">
  <button class="tab on" type="button" data-go="f-res"><svg class="ic"><use href="#i-home"/></svg>Início</button>
  <button class="tab" type="button" data-go="f-pac"><svg class="ic"><use href="#i-box"/></svg>Pacotes &amp; Avulsas</button>
  <button class="tab" type="button" data-go="f-ses"><svg class="ic"><use href="#i-cal"/></svg>Sessões</button>
  <button class="tab" type="button" data-go="f-pag"><svg class="ic"><use href="#i-fin"/></svg>Pagamentos</button>
  <button class="tab" type="button" data-go="f-doc"><svg class="ic"><use href="#i-doc"/></svg>Documentos</button>
  <button class="tab" type="button" data-go="f-ia">✦ I.A</button>
</div></nav>
<div class="wrap" id="fcBody"><p class="estado">Carregando seu espaço…</p></div>
<p class="rodape">Fênix Estética · espaço do cliente</p>
<script>
(function(){
var API='https://fenix-api.geniterapeuta12.workers.dev';
var KEY='fenix-publica-2026';
function getId(){
 var m=String(location.hash||'').match(/cli=([A-Za-z0-9_-]+)/);if(m)return m[1];
 m=String(location.search||'').match(/cli=([A-Za-z0-9_-]+)/);if(m)return m[1];
 return null;}
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function dataBR(d){if(!d)return '—';var p=String(d).split('/');if(p.length===3)return d;var m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:d;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sec(n,titulo,corpo){return '<div class="panelcard" id="f-'+n+'"><div class="pc-tt"><span class="dot"></span>'+titulo+'</div><hr class="frule">'+corpo+'</div>';}
function estado(html){document.getElementById('fcTabs').style.display='none';document.getElementById('fcBody').innerHTML='<p class="estado">'+html+'</p>';}
function render(d){
 var clin=d.clinica||'—';
 document.getElementById('fcClin').textContent=clin;
 document.getElementById('fcQuem').style.display='flex';
 document.getElementById('fcNome').textContent=d.cliente&&d.cliente.nome?d.cliente.nome:'—';
 document.getElementById('fcAv').textContent=(d.cliente&&d.cliente.nome?d.cliente.nome.charAt(0):'?').toUpperCase();
 var nome=d.cliente&&d.cliente.nome?d.cliente.nome.split(' ')[0]:'';
 var pac=d.pacotes||[],prox=d.proximas||[],real=d.realizadas||[],pag=d.pagamentos||[];
 var perm=(function(){var t=d.cliente&&d.cliente.ctabs;
  if(typeof t==='string'&&t.length>1){try{t=JSON.parse(t);}catch(e){t=null;}}
  if(t&&t.abas)t=t.abas;
  var all=['res','pac','ses','pag','doc'];if(t&&t.length){var okk=all.filter(function(k){return t.indexOf(k)>=0;});if(okk.length)return okk;}return all;})();
 var PERS=(function(){var p=d.cliente&&d.cliente.ctabs;
  if(typeof p==='string'&&p.length>1){try{p=JSON.parse(p);}catch(e){p=null;}}
  return (p&&!Array.isArray(p))?p:null;})();
 var P2=function(k,x){return perm.indexOf(k)>=0?x:'';};
 if(PERS&&PERS.cor){document.documentElement.style.setProperty('--acc',String(PERS.cor).slice(0,20));}
 if(PERS&&PERS.msg){var hmsg=document.querySelector('.fc-head');if(hmsg&&!document.getElementById('fcMsgTop')){var mdiv=document.createElement('div');mdiv.id='fcMsgTop';mdiv.className='fcmsg';mdiv.textContent=String(PERS.msg).slice(0,90);hmsg.parentNode.insertBefore(mdiv,hmsg.nextSibling);}}
 var contratado=0;pac.forEach(function(p){contratado+=Number(p.valor)||0;});
 var pago=Number(d.pago_total||0);var aberto=Math.max(0,contratado-pago);
 var h='';
 h+=P2('res','<div class="fcpanel on" id="f-res">'+
  sec('resc','Início',
  '<div class="hero"><div style="font-size:2.4rem;color:var(--acc,#d4af37)">✦</div>'+
  '<div class="grande">Olá, '+esc(nome)+'<span>!</span></div>'+
  '<p class="fsub">Este é o seu espaço — aqui você acompanha tudo com a '+esc(clin)+'.</p>'+
  (prox.length?'<div class="prox"><small>Próxima sessão</small><b>'+dataBR(prox[0].data)+'</b><span>'+esc(prox[0].pacote||'Sessão')+(prox[0].num!=null?' · #'+prox[0].num:'')+'</span></div>':'<div class="prox"><small>Agenda</small><b>Nada agendado por enquanto</b><span>Fale com a clínica para agendar.</span></div>')+
  ((d.wa||d.insta)?'<div class="prox" style="margin-top:10px"><small>Fale com a clínica</small><b style="display:flex;gap:12px;flex-wrap:wrap">'+(d.wa?'<a href="https://wa.me/55'+String(d.wa).replace(/\D/g,'')+'" target="_blank" rel="noopener" style="color:var(--acc,#d4af37);text-decoration:none">💬 '+esc(d.wa)+'</a>':'')+(d.insta?'<a href="https://instagram.com/'+esc(String(d.insta).replace(/^@/,''))+'" target="_blank" rel="noopener" style="color:var(--acc,#d4af37);text-decoration:none">📸 @'+esc(String(d.insta).replace(/^@/,''))+'</a>':'')+'</b><span>agendamentos e dúvidas por aí</span></div>':'')+
  '</div>')+'</div>');
 h+=P2('pac','<div class="fcpanel" id="f-pac">'+
  sec('pacc','Pacotes & Avulsas',
  pac.length?'<table><tr><th>Pacote</th><th>Progresso</th><th class="num">Valor</th><th class="num">Pago</th></tr>'+
  pac.map(function(p){var qtd=Number(p.qtd)||0,feitas=Number(p.feitas)||0,pp=Number(p.pago)||0,falta=Math.max(0,(Number(p.valor)||0)-pp);
   var pct=qtd?Math.min(100,Math.round(feitas/qtd*100)):0;
   var it=(p.itens||[]).map(function(x){return (x.tipo==='produto'?'🧴 ':'🧖 ')+esc(x.nome)+(Number(x.valor)>0?' · '+brl(x.valor):' · incluído');}).join('  ·  ');
   return '<tr><td><b>'+esc(p.nome)+'</b><br><span class="fsub">'+feitas+' de '+qtd+' sessões · '+(falta?'<span class="aberto">falta '+brl(falta)+'</span>':'<span class="pos">quitado</span>')+'</span>'+(it?'<span style="display:block;margin-top:6px;color:#bdb49b;font-size:.74rem;line-height:1.5">'+it+'</span>':'')+'</td><td><div class="bar"><i style="width:'+pct+'%"></i></div><span class="pct">'+pct+'%</span></td><td class="num">'+brl(p.valor)+'</td><td class="num">'+brl(pp)+'</td></tr>';}).join('')+'</table>'
  :'<p class="fempty">Nenhum pacote ainda.</p>')+'</div>');
 h+=P2('ses','<div class="fcpanel" id="f-ses">'+
  sec('sesc','Sessões',
  (prox.length?'<p class="fsub" style="margin-bottom:6px"><b style="color:#e7c96a">Próximas</b></p><table>'+prox.map(function(s){return '<tr><td>'+dataBR(s.data)+'</td><td>'+esc(s.pacote||'Sessão')+' #'+(s.num!=null?s.num:'—')+'</td><td>'+esc(s.obs||'')+'</td></tr>';}).join('')+'</table>':'<p class="fempty">Nada agendado por enquanto.</p>')+
  (real.length?'<p class="fsub" style="margin:12px 0 6px"><b style="color:#e7c96a">Já realizadas ('+real.length+')</b></p><table>'+real.map(function(s){return '<tr><td>'+dataBR(s.data)+'</td><td>'+esc(s.pacote||'Sessão')+' #'+(s.num!=null?s.num:'—')+'</td><td>'+esc(s.obs||'')+'</td></tr>';}).join('')+'</table>':'<p class="fempty">Nenhuma realizada ainda.</p>'))+'</div>');
 h+=P2('pag','<div class="fcpanel" id="f-pag">'+
  sec('pagc','Pagamentos',
  (contratado?'<p class="fsub" style="margin-bottom:8px">Contratado: <b>'+brl(contratado)+'</b> · Pago: <b class="pos">'+brl(pago)+'</b> · Em aberto: <b class="aberto">'+brl(aberto)+'</b></p>':'')+
  (pag.length?'<table><tr><th>Data</th><th>Forma</th><th>Observação</th><th class="num">Valor</th></tr>'+
  pag.map(function(p){return '<tr><td>'+dataBR(p.data)+'</td><td>'+esc(p.metodo||'—')+'</td><td>'+esc(p.obs||'')+'</td><td class="num">'+brl(p.valor)+'</td></tr>';}).join('')+
  '<tr><td colspan="3" style="text-align:right"><b>Total pago</b></td><td class="num"><b class="pos">'+brl(pago)+'</b></td></tr></table>'
  :'<p class="fempty">Nenhum pagamento registrado.</p>'))+'</div>');
 var docs=(d.documentos||[]).map(function(x){return {t:String(x.titulo||'Documento').replace(/<[^>]*>/g,'').slice(0,120),x:String(x.texto||'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/ on[a-z]+="[^"]*"/gi,''),dt:String(x.data||'')};});
 h+=P2('doc','<div class="fcpanel" id="f-doc">'+
  sec('docc','Documentos',
  (docs.length?'<p class="fsub" style="margin-bottom:6px">Documentos que a clínica enviou pra você — toque para ler.</p>'+docs.map(function(dd,i){return '<details class="doc"'+(i===0&&docs.length===1?' open':'')+'><summary><span>'+esc(dd.t)+'</span><small>'+dataBR(dd.dt)+'</small></summary><div class="dtexto">'+dd.x+'</div></details>';}).join('')
  :'<p class="fdempty">Nenhum documento enviado pela clínica ainda.<br>Quando ela mandar (contrato, anamnese, prescrição…), aparece aqui.</p>'))+'</div>');
 var tb=document.querySelectorAll('#fcTabs .tab');for(var i=0;i<tb.length;i++){var g=tb[i].getAttribute('data-go').replace('f-','');tb[i].style.display=perm.indexOf(g)>=0?'':'none';}
 h+='<div class="fcpanel" id="f-ia">'+sec('iac','✦ Assistente da clínica',
  '<div id="fcIaMsgs" style="min-height:110px;max-height:46vh;overflow-y:auto;padding:4px"></div>'+
  '<div style="display:flex;gap:8px;margin-top:10px"><input id="fcIaIn" placeholder="Ex.: quantas sessões já fiz?" style="flex:1;padding:12px;border-radius:12px;border:1px solid #3a3428;background:#1d1a14;color:#efe8d6;font-family:inherit;font-size:.95rem"><button id="fcIaGo" style="padding:12px 16px;border-radius:12px;border:none;background:var(--acc,#d4af37);color:#141414;font-weight:700">Enviar</button></div>'+
  '<p class="fsub" style="margin-top:8px">Ela responde com base nos SEUS dados (sessões, pacotes, pagamentos). Para agendar ou remarcar, fale com a clínica.</p>')+'</div>';
 document.getElementById('fcBody').innerHTML=h;
 if(perm.indexOf('res')<0)vai('f-'+perm[0]);
 document.getElementById('fcTabs').style.display='flex';
 try{iaWire();}catch(e){}
}
/* navegação por abas */
function vai(go){
 var ls=document.querySelectorAll('#fcTabs .tab');for(var i=0;i<ls.length;i++)ls[i].classList.toggle('on',ls[i].dataset.go===go);
 var ps=document.querySelectorAll('.fcpanel');for(var j=0;j<ps.length;j++)ps[j].classList.toggle('on',ps[j].id===go);
 try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);}}
document.getElementById('fcTabs').addEventListener('click',function(e){
 var b=e.target.closest('.tab');if(b)vai(b.dataset.go);});
var id=getId();
if(!id){estado('<b>Link incompleto.</b><br>Peça à clínica o seu link completo do Fênix Clients.');document.getElementById('fcClin').textContent='—';return;}
fetch(API+'/rest/v1/rpc/fenix_cliente_pub',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({p_id:id})})
.then(function(r){if(!r.ok)throw 0;return r.json();})
.then(function(d){
 if(d&&d.erro==='sem_acesso'){estado('⏸ <b>Seu acesso está pausado pela clínica.</b><br>Fale com ela para reativar.');document.getElementById('fcClin').textContent='—';return;}
 var at=(String(location.hash||'').match(/ate=(\d{4}-\d{2}-\d{2})/)||[])[1];
 if(at&&new Date(at+'T23:59:59')<new Date()){estado('⌛ <b>Seu acesso programado venceu em '+at.split('-').reverse().join('/')+'.</b><br>Fale com a clínica para renovar.');document.getElementById('fcClin').textContent='—';return;}
 if(!d||!d.cliente){estado('<b>Link inválido ou cliente não encontrada.</b><br>Confira o endereço ou peça um novo link à clínica.');document.getElementById('fcClin').textContent='—';return;}
 render(d);})
.catch(function(){estado('<b>Sem conexão agora.</b><br>Verifique a internet e recarregue a página.');});

/* ✦ I.A da cliente */
var iaHist=[];
function iaRender(){var bx=document.getElementById('fcIaMsgs');if(!bx)return;
 bx.innerHTML=iaHist.length?iaHist.map(function(m){return '<div class="iamsg '+m.p+'">'+esc(m.t).replace(/\n/g,'<br>')+'</div>';}).join(''):'<p class="fempty">Pergunta à vontade — ex.: «quantas sessões já fiz?» · «quando é minha próxima?» · «quanto já paguei?»</p>';
 try{bx.scrollTop=bx.scrollHeight;}catch(e){}}
function iaPerg(){var inp=document.getElementById('fcIaIn');if(!inp)return;var t=(inp.value||'').trim();if(!t)return;
 inp.value='';iaHist.push({p:'user',t:t});iaRender();
 var bx=document.getElementById('fcIaMsgs');bx.insertAdjacentHTML('beforeend','<div class="iamsg ia" id="fcIaWait">✍️ pensando…</div>');bx.scrollTop=bx.scrollHeight;
 fetch(API+'/ia-cliente',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({p_id:id,pergunta:t,historico:iaHist.slice(-6).map(function(m){return {role:m.p==='user'?'user':'assistant',content:m.t};})})})
 .then(function(r){return r.json().then(function(j2){return {ok:r.ok,j:j2};});})
 .then(function(o){var w=document.getElementById('fcIaWait');if(w&&w.parentNode)w.parentNode.removeChild(w);
  iaHist.push({p:'ia',t:(o.ok&&o.j&&o.j.resposta)?o.j.resposta:('⚠ '+((o.j&&o.j.erro)||'não consegui responder agora — tenta de novo'))});iaRender();})
 .catch(function(){var w=document.getElementById('fcIaWait');if(w&&w.parentNode)w.parentNode.removeChild(w);iaHist.push({p:'ia',t:'⚠ Sem internet agora — tenta de novo.'});iaRender();});}
function iaWire(){var b=document.getElementById('fcIaGo'),i2=document.getElementById('fcIaIn');if(!b)return;
 b.addEventListener('click',iaPerg);i2.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();iaPerg();}});iaRender();}
})();
</script>
